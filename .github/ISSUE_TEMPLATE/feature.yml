name: 기능 요청
description: 새 화면이나 기능을 제안합니다.
title: "[기능] "
labels: ["feature"]
body:
  - type: input
    id: spec
    attributes:
      label: 기능 명세서 번호
      description: 기능 명세서의 기능 번호가 있으면 적어 주세요.
      placeholder: "예: 기능 4 (대중교통 즐겨찾기)"
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 이 기능이 왜 필요한지, 사용자는 무엇을 할 수 있게 되는지
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 내용
      description: 필요한 화면, 상태(로딩·빈 화면·실패), 백엔드 API 등을 할 일 목록으로 적어 주세요.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: design
    attributes:
      label: 디자인 시안
      description: Figma 링크 등
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 어떤 상태가 되면 끝난 것인지
      placeholder: "예: 앱을 열자마자 즐겨찾기한 버스의 도착 정보가 보인다"
  - type: textarea
    id: notes
    attributes:
      label: 참고 / 확인 필요
      description: 관련 문서, 백엔드와 맞출 부분, 필요한 권한(위치 등)
